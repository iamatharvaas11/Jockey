[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jocky"
version = "0.1.0"
description = "JOCKY — Domain-specific forensic programming language and framework"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.19.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt==4.0.1",
    "python-multipart>=0.0.6",
    "aiofiles>=23.2.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "email-validator>=2.0.0",
    "jinja2>=3.1.0",
    "psutil>=5.9.0",
    "lark>=1.1.0",
    "llvmlite>=0.41.0",
    "pefile>=2023.2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
]
windows = [
    "pywin32>=306",
]

[project.scripts]
jocky = "compiler.cli:main"
jocky-server = "backend.app.main:run_server"

[tool.setuptools]
packages = [
    "compiler",
    "collectors",
    "engine",
    "evidence",
    "runtime",
    "runtime.adapters",
    "analysis",
    "analysis.ioc",
    "analysis.correlation",
    "analysis.timeline",
    "analysis.security",
    "agent",
    "resilience",
    "backend",
    "backend.app",
    "backend.app.api",
    "backend.app.api.v1",
    "backend.app.api.v1.endpoints",
    "backend.app.core",
    "backend.app.db",
    "backend.app.models",
    "backend.app.schemas",
    "backend.app.services",
    "backend.app.repositories"
]

[tool.setuptools.package-data]
compiler = ["*.lark"]
"analysis.ioc" = ["*.json"]
backend = ["app/templates/**/*", "app/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "windows",
    "linux",
    "slow",
]
