<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOCKY // Secure Operator Authentication</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@600;700;900&family=Rajdhani:wght@600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            green: '#00ff9d',
                            cyan: '#00f0ff',
                            red: '#ff2a5f',
                            dark: '#04070e',
                            surface: '#070c18',
                            border: 'rgba(30, 58, 102, 0.5)'
                        }
                    },
                    fontFamily: {
                        hud: ['Orbitron', 'Rajdhani', 'sans-serif'],
                        data: ['Share Tech Mono', 'monospace'],
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom Cyber CSS -->
    <link rel="stylesheet" href="/static/css/custom.css">
    
    <!-- Three.js & Cyber3D Visualizer -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="/static/js/cyber_3d.js"></script>
    
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
    <script src="/static/js/app.js"></script>
</head>
<body class="bg-cyber-dark text-slate-200 antialiased h-screen w-screen overflow-hidden flex items-center justify-center relative select-none">

    <!-- 3D Security Matrix Interactive Background Canvas -->
    <canvas id="securityMatrixCanvas" class="fixed inset-0 w-full h-full pointer-events-none z-0"></canvas>

    <!-- Scanline & Cyber Overlays -->
    <div class="cyber-radial-overlay"></div>
    <div class="scanline-overlay"></div>

    <!-- Central Cybernetic Authentication Console -->
    <div class="w-full max-w-md p-8 hud-panel hud-corner-brackets rounded-lg z-10 relative bg-cyber-surface/90 border border-cyber-cyan/30 shadow-[0_0_50px_rgba(0,0,0,0.9),0_0_20px_rgba(0,240,255,0.15)]" 
         x-data="{ 
             email: 'admin@jocky.org', 
             password: 'admin123', 
             error: '', 
             loading: false,
             async login() {
                this.loading = true;
                this.error = '';
                try {
                    const formData = new FormData();
                    formData.append('username', this.email);
                    formData.append('password', this.password);
                    
                    const response = await fetch('/api/v1/auth/login', {
                        method: 'POST',
                        body: formData
                    });
                    
                    const data = await response.json();
                    
                    if (response.ok) {
                        localStorage.setItem('jocky_token', data.access_token);
                        localStorage.setItem('jocky_user', JSON.stringify({ 
                            name: this.email.split('@')[0], 
                            email: this.email 
                        }));
                        window.location.href = '/dashboard';
                    } else {
                        this.error = data.detail || 'Authentication rejected by security controller.';
                    }
                } catch (err) {
                    this.error = 'Network link disrupted. C2 unreachable.';
                } finally {
                    this.loading = false;
                }
             } 
         }">
        
        <!-- Top Tactical Header Indicator -->
        <div class="flex items-center justify-between text-[10px] font-data text-slate-500 border-b border-slate-800 pb-3 mb-6">
            <span class="text-cyber-cyan flex items-center gap-1.5 font-bold tracking-widest">
                <span class="beacon-pulse beacon-cyan"></span>
                CLASSIFIED AUTH GATEWAY
            </span>
            <span class="text-slate-400 font-mono">TLS 1.3 // AES-GCM</span>
        </div>

        <!-- Brand Identity Icon -->
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-lg bg-cyan-950/40 border border-cyber-cyan text-cyber-cyan shadow-[0_0_25px_rgba(0,240,255,0.3)] mb-3">
                <i class="fa-solid fa-shield-halved text-3xl animate-pulse"></i>
            </div>
            <h1 class="text-2xl font-hud font-extrabold text-white tracking-widest">JOCKY <span class="text-cyber-green text-sm">C2</span></h1>
            <p class="text-slate-400 text-xs font-data uppercase tracking-wider mt-1">FORENSIC OPERATING ENVIRONMENT</p>
        </div>

        <!-- Error Banner -->
        <div x-show="error" 
             x-transition
             class="mb-4 p-3 bg-red-950/60 border border-cyber-red/50 rounded text-cyber-red text-xs font-data flex items-center gap-2" 
             style="display: none;">
            <i class="fa-solid fa-triangle-exclamation text-sm shrink-0"></i>
            <span x-text="error"></span>
        </div>

        <!-- Credentials Form -->
        <form @submit.prevent="login" class="space-y-4 font-data">
            <div>
                <label class="block text-xs font-hud font-bold text-slate-300 uppercase tracking-wider mb-1.5 flex justify-between">
                    <span>Operator Identity</span>
                    <span class="text-[10px] text-cyber-cyan font-mono">[EMAIL / UID]</span>
                </label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-500">
                        <i class="fa-solid fa-user-ninja"></i>
                    </div>
                    <input type="text" x-model="email" required
                           class="cyber-input w-full pl-10 pr-3 py-2.5 rounded text-sm text-white placeholder-slate-600 focus:border-cyber-cyan"
                           placeholder="operator@jocky.org">
                </div>
            </div>
            
            <div>
                <label class="block text-xs font-hud font-bold text-slate-300 uppercase tracking-wider mb-1.5 flex justify-between">
                    <span>Cryptographic Key</span>
                    <span class="text-[10px] text-slate-500 font-mono">[PASSPHRASE]</span>
                </label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-500">
                        <i class="fa-solid fa-key"></i>
                    </div>
                    <input type="password" x-model="password" required
                           class="cyber-input w-full pl-10 pr-3 py-2.5 rounded text-sm text-white placeholder-slate-600 focus:border-cyber-cyan"
                           placeholder="••••••••••••">
                </div>
            </div>

            <!-- Demo Helper Quick-Fill Banner -->
            <div class="p-2.5 bg-slate-900/80 border border-slate-800 rounded flex items-center justify-between text-[11px] text-slate-400">
                <span class="text-cyber-green font-mono"><i class="fa-solid fa-circle-check mr-1"></i> Demo Credentials:</span>
                <span class="text-slate-300 font-mono">admin@jocky.org // admin123</span>
            </div>

            <!-- Submit Button -->
            <button type="submit" :disabled="loading"
                    class="w-full mt-5 cyber-btn py-3 text-sm tracking-widest flex justify-center items-center gap-2">
                <span x-show="!loading" class="flex items-center gap-2">
                    <i class="fa-solid fa-arrow-right-to-bracket"></i> AUTHENTICATE & ENGAGE
                </span>
                <span x-show="loading" class="flex items-center gap-2 text-slate-900">
                    <i class="fa-solid fa-circle-notch fa-spin"></i> VERIFYING CREDENTIALS...
                </span>
            </button>
        </form>

        <div class="mt-6 pt-4 border-t border-slate-800/80 flex items-center justify-between text-xs font-data text-slate-500">
            <span>UNAUTHORIZED ACCESS STRICTLY MONITORED</span>
            <a href="/register" class="text-cyber-cyan hover:underline font-bold">REQUEST CLEARANCE</a>
        </div>
    </div>

    <!-- 3D Background Matrix Initialization -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.Cyber3D) {
                window.Cyber3D.initSecurityMatrix('securityMatrixCanvas');
            }
        });
    </script>
</body>
</html>
