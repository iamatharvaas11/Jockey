<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOCKY // Operator Registration & Clearance</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@600;700;900&family=Rajdhani:wght@600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            green: '#00ff9d',
                            cyan: '#00f0ff',
                            red: '#ff2a5f',
                            dark: '#04070e',
                            surface: '#070c18',
                            border: 'rgba(30, 58, 102, 0.5)'
                        }
                    },
                    fontFamily: {
                        hud: ['Orbitron', 'Rajdhani', 'sans-serif'],
                        data: ['Share Tech Mono', 'monospace'],
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom Cyber CSS -->
    <link rel="stylesheet" href="/static/css/custom.css">
    
    <!-- Three.js & Cyber3D Visualizer -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="/static/js/cyber_3d.js"></script>
    
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
    <script src="/static/js/app.js"></script>
</head>
<body class="bg-cyber-dark text-slate-200 antialiased min-h-screen w-screen overflow-x-hidden flex items-center justify-center relative select-none py-10">

    <!-- 3D Security Matrix Interactive Background Canvas -->
    <canvas id="registerMatrixCanvas" class="fixed inset-0 w-full h-full pointer-events-none z-0"></canvas>

    <!-- Scanline & Cyber Overlays -->
    <div class="cyber-radial-overlay"></div>
    <div class="scanline-overlay"></div>

    <!-- Central Cybernetic Registration Console -->
    <div class="w-full max-w-lg p-8 hud-panel hud-corner-brackets rounded-lg z-10 relative bg-cyber-surface/90 border border-cyber-cyan/30 shadow-[0_0_50px_rgba(0,0,0,0.9),0_0_20px_rgba(0,240,255,0.15)] my-6" 
         x-data="{ 
             name: '', 
             email: '', 
             role: 'INVESTIGATOR',
             password: '', 
             confirm: '', 
             error: '', 
             success: '', 
             loading: false,
             async register() {
                if (this.password !== this.confirm) {
                    this.error = 'Cryptographic passphrases do not match.';
                    return;
                }
                this.loading = true;
                this.error = '';
                
                try {
                    const response = await fetch('/api/v1/auth/register', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            full_name: this.name, 
                            email: this.email, 
                            role: this.role,
                            password: this.password 
                        })
                    });
                    
                    const data = await response.json();
                    
                    if (response.ok) {
                        this.success = 'Clearance granted. Initializing operator profile...';
                        setTimeout(() => window.location.href = '/login', 1500);
                    } else {
                        this.error = data.detail || 'Clearance authorization failed.';
                    }
                } catch (err) {
                    this.error = 'Network link disrupted. C2 unreachable.';
                } finally {
                    this.loading = false;
                }
             } 
         }">
        
        <!-- Top Tactical Header Indicator -->
        <div class="flex items-center justify-between text-[10px] font-data text-slate-500 border-b border-slate-800 pb-3 mb-6">
            <span class="text-cyber-cyan flex items-center gap-1.5 font-bold tracking-widest">
                <span class="beacon-pulse beacon-cyan"></span>
                PERSONNEL PROVISIONING GATEWAY
            </span>
            <span class="text-slate-400 font-mono">CLEARANCE LEVEL: SEC-OP</span>
        </div>

        <!-- Header -->
        <div class="text-center mb-6">
            <h1 class="text-2xl font-hud font-extrabold text-white tracking-widest">ENLIST OPERATOR</h1>
            <p class="text-slate-400 text-xs font-data uppercase tracking-wider mt-1">PROVISION CLASSIFIED INVESTIGATIVE ACCESS</p>
        </div>

        <!-- Success Banner -->
        <div x-show="success" 
             x-transition
             class="mb-4 p-3 bg-emerald-950/70 border border-cyber-green/50 rounded text-cyber-green text-xs font-data flex items-center gap-2" 
             style="display: none;">
            <i class="fa-solid fa-circle-check text-sm shrink-0"></i>
            <span x-text="success"></span>
        </div>

        <!-- Error Banner -->
        <div x-show="error" 
             x-transition
             class="mb-4 p-3 bg-red-950/70 border border-cyber-red/50 rounded text-cyber-red text-xs font-data flex items-center gap-2" 
             style="display: none;">
            <i class="fa-solid fa-triangle-exclamation text-sm shrink-0"></i>
            <span x-text="error"></span>
        </div>

        <!-- Form -->
        <form @submit.prevent="register" class="space-y-4 font-data">
            <div>
                <label class="block text-xs font-hud font-bold text-slate-300 uppercase tracking-wider mb-1.5">
                    Operator Full Legal / Alias Name
                </label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-500">
                        <i class="fa-solid fa-id-card"></i>
                    </div>
                    <input type="text" x-model="name" required
                           class="cyber-input w-full pl-10 pr-3 py-2.5 rounded text-sm text-white placeholder-slate-600 focus:border-cyber-cyan"
                           placeholder="Special Agent Sharma">
                </div>
            </div>

            <div>
                <label class="block text-xs font-hud font-bold text-slate-300 uppercase tracking-wider mb-1.5">
                    Official Secure Email Address
                </label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-500">
                        <i class="fa-solid fa-envelope"></i>
                    </div>
                    <input type="email" x-model="email" required
                           class="cyber-input w-full pl-10 pr-3 py-2.5 rounded text-sm text-white placeholder-slate-600 focus:border-cyber-cyan"
                           placeholder="agent@jocky.org">
                </div>
            </div>

            <div>
                <label class="block text-xs font-hud font-bold text-slate-300 uppercase tracking-wider mb-1.5">
                    Assigned Operational Clearance Role
                </label>
                <select x-model="role" class="cyber-input w-full px-3 py-2.5 rounded text-sm text-white focus:border-cyber-cyan bg-slate-900">
                    <option value="INVESTIGATOR">Investigator (Full Artifact & Evidence Scan)</option>
                    <option value="ANALYST">Analyst (Telemetry & Report Viewer)</option>
                    <option value="ADMIN">Command Controller (System Admin)</option>
                </select>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-hud font-bold text-slate-300 uppercase tracking-wider mb-1.5">
                        Passphrase Key
                    </label>
                    <input type="password" x-model="password" required
                           class="cyber-input w-full px-3 py-2.5 rounded text-sm text-white placeholder-slate-600 focus:border-cyber-cyan"
                           placeholder="••••••••••••">
                </div>
                <div>
                    <label class="block text-xs font-hud font-bold text-slate-300 uppercase tracking-wider mb-1.5">
                        Confirm Key
                    </label>
                    <input type="password" x-model="confirm" required
                           class="cyber-input w-full px-3 py-2.5 rounded text-sm text-white placeholder-slate-600 focus:border-cyber-cyan"
                           placeholder="••••••••••••">
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" :disabled="loading"
                    class="w-full mt-4 cyber-btn cyber-btn-cyan py-3 text-sm tracking-widest flex justify-center items-center gap-2">
                <span x-show="!loading" class="flex items-center gap-2">
                    <i class="fa-solid fa-shield"></i> SUBMIT CLEARANCE ENLISTMENT
                </span>
                <span x-show="loading" class="flex items-center gap-2 text-slate-900">
                    <i class="fa-solid fa-circle-notch fa-spin"></i> PROVISIONING IDENTITY...
                </span>
            </button>
        </form>

        <div class="mt-6 pt-4 border-t border-slate-800/80 flex items-center justify-between text-xs font-data text-slate-500">
            <span>EXISTING AUTHORIZED OPERATOR?</span>
            <a href="/login" class="text-cyber-green hover:underline font-bold">ACCESS CONSOLE</a>
        </div>
    </div>

    <!-- 3D Matrix Background -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.Cyber3D) {
                window.Cyber3D.initSecurityMatrix('registerMatrixCanvas');
            }
        });
    </script>
</body>
</html>
